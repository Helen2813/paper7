name: OnsetAudit core tests
on:
  push:
    paths: ['onsetaudit/**', 'launch_onsetaudit.sh', '.github/workflows/onsetaudit-tests.yml']
  pull_request:
    paths: ['onsetaudit/**', 'launch_onsetaudit.sh', '.github/workflows/onsetaudit-tests.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r onsetaudit/requirements.txt
      - name: Run metadata / model / provenance tests
        run: python -m unittest discover -s onsetaudit/tests -v
      - name: Check syntax
        run: python -m py_compile onsetaudit/core.py onsetaudit/app.py
